project:
  type: book
  output-dir: _site
  execute-dir: project  # pages read the data by a path from the top of the project

book:
  title: "EEG from the recording up"
  subtitle: "A hands-on introduction using the lab's category-learning data"
  chapters:
    - index.qmd
    - chapters/01-what-eeg-measures.qmd
    - chapters/02-raw-data.qmd
    - chapters/03-cleaning.qmd
    - chapters/04-erps.qmd
    - chapters/05-rhythms.qmd
    - chapters/06-decoding.qmd
    - chapters/07-connectivity.qmd
    - chapters/08-comparing-visits.qmd
    - chapters/09-group.qmd
    - references.qmd

bibliography: references.bib

# Pages are executed on a machine that has the demo data; the results are
# stored in _freeze/ and committed, so the site can be rendered anywhere.
execute:
  freeze: auto
  warning: false

format:
  html:
    theme: cosmo
    toc: true
    code-tools: true
    fig-width: 8
    fig-height: 4.5
